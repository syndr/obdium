# CI check: builds Linux bundles (deb, rpm, AppImage) for x86_64 and aarch64
# on every push to main and uploads them as workflow artifacts. Releases are
# handled by publish.yml on `v*` tags.
#
# Note: `libudev-dev` is required by the `serialport` crate; without it the
# build fails in `libudev-sys`'s build script.

name: 'build-linux'

on:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: lts/*

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils \
            libudev-dev \
            libssl-dev \
            build-essential \
            curl \
            wget \
            file

      - name: build bundles
        uses: tauri-apps/tauri-action@v1
        with:
          projectPath: backend
          args: --bundles deb,rpm,appimage

      - name: upload bundles
        uses: actions/upload-artifact@v7
        with:
          name: obdium-${{ matrix.target }}
          if-no-files-found: error
          path: |
            backend/target/release/bundle/deb/*.deb
            backend/target/release/bundle/rpm/*.rpm
            backend/target/release/bundle/appimage/*.AppImage
